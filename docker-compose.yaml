services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  musicjam-gateway:
    build:
      context: .
      dockerfile: Backend/MusicJam.ApiGateway/Dockerfile
    expose:
      - "8080"
    depends_on:
      musicjam-studio:
        condition: service_started
      musicjam-runtime:
        condition: service_started

  musicjam-studio:
    build:
      context: .
      dockerfile: Backend/MusicJam.Studio/Dockerfile
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"
      ObjectStorageSettings__AccessKey: "${S3_ACCESS_KEY}"
      ObjectStorageSettings__SecretKey: "${S3_SECRET_KEY}"
      ObjectStorageSettings__BucketName: "${S3_BUCKET_NAME}"

  musicjam-runtime:
    build:
      context: .
      dockerfile: Backend/MusicJam.Runtime/Dockerfile
    expose:
      - "8080"
    depends_on:
      musicjam-studio:
        condition: service_started
    environment:
      JwtSettings__SecretKey: "${JWT_SECRET}"
      JwtSettings__Issuer: "${JWT_ISSUER}"
      JwtSettings__Audience: "${JWT_AUDIENCE}"

volumes:
  postgres_data: